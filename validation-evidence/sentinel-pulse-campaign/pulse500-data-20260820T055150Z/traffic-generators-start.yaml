    name: aims-sentinel-loadgen
    namespace: production
    resourceVersion: "139746774"
    uid: 00b47d29-c6bc-42de-9e8b-c673b663d0c6
  spec:
    progressDeadlineSeconds: 600
    replicas: 1
    revisionHistoryLimit: 10
    selector:
      matchLabels:
        app.kubernetes.io/name: aims-sentinel-loadgen
    strategy:
      rollingUpdate:
        maxSurge: 25%
        maxUnavailable: 25%
      type: RollingUpdate
    template:
      metadata:
        labels:
          app.kubernetes.io/name: aims-sentinel-loadgen
          app.kubernetes.io/part-of: agent-runtime-sentinel
      spec:
        automountServiceAccountToken: false
        containers:
        - args:
          - |
            set -eu
            ingress=http://aims-ingress-istio.istio-ingress.svc.cluster.local
            services="api-gateway auth-service cart-service catalog-service inventory-service order-service payment-service notification-service security-telemetry-service"
            i=0
            while true; do
              # Valid read traffic through the real Istio Gateway + waypoint.
              wget -q -O /dev/null -T 3 "$ingress/" || true
              wget -q -O /dev/null -T 3 "$ingress/api/health/" || true
              wget -q -O /dev/null -T 3 "$ingress/api/products/" || true
              wget -q -O /dev/null -T 3 "$ingress/api/products/1/" || true
              # Every backend exposes /api/health/. Direct service health calls
              # diversify server-side syscall telemetry without fabricating a
              # login token or mutating orders/payments.
              for service in $services; do
                wget -q -O /dev/null -T 3 "http://$service:8000/api/health/" || true
              done
              # A smaller, explicitly normal Internet error mix is retained.
              # It runs once per five cycles instead of dominating every cycle.
              if [ $((i % 5)) -eq 0 ]; then
                wget -q -O /dev/null -T 3 "$ingress/api/auth/me/" || true
                wget -q -O /dev/null -T 3 "$ingress/api/cart/" || true
              fi
              i=$((i + 1))
              sleep "${SLEEP_SECONDS:-1}"
            done
          command:
          - /bin/sh
          - -c
          env:
          - name: SLEEP_SECONDS
            value: "1"
          image: busybox@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
          imagePullPolicy: IfNotPresent
          name: loadgen
          resources:
            limits:
              cpu: 250m
              memory: 32Mi
            requests:
              cpu: 10m
              memory: 8Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
        dnsPolicy: ClusterFirst
        restartPolicy: Always
        schedulerName: default-scheduler
        securityContext:
          runAsGroup: 65534
          runAsNonRoot: true
          runAsUser: 65534
          seccompProfile:
            type: RuntimeDefault
        terminationGracePeriodSeconds: 30
