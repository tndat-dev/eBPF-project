              printf '' | nc -w 2 aims-kafka-kafka-bootstrap 9092 >/dev/null 2>&1 || true
              printf '' | nc -w 2 aims-rabbitmq 5672 >/dev/null 2>&1 || true
              sleep "${SLEEP_SECONDS:-2}"
            done
