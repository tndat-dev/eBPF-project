apiVersion: v1
kind: ConfigMap
metadata:
  name: shop-app
  namespace: production
data:
  server.py: |
    import json, os
    from http.server import BaseHTTPRequestHandler, HTTPServer
    role = os.getenv("SHOP_ROLE", "frontend")
    deps = {key: os.getenv(key, "") for key in ("REDIS_URL", "KAFKA_BOOTSTRAP", "RABBITMQ_URL", "KEYCLOAK_URL")}
    class Handler(BaseHTTPRequestHandler):
      def do_GET(self):
        body = {"service": role, "path": self.path, "status": "ok", "dependencies": deps}
        self.send_response(200); self.send_header("content-type", "application/json"); self.end_headers()
        self.wfile.write(json.dumps(body).encode())
      def log_message(self, fmt, *args): print(json.dumps({"service": role, "request": fmt % args}), flush=True)
    HTTPServer(("", 8080), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop-frontend
  namespace: production
  labels: {app: shop-frontend, app.kubernetes.io/part-of: ecommerce-production-simulation}
spec:
  replicas: 2
  selector: {matchLabels: {app: shop-frontend}}
  template:
    metadata:
      labels: {app: shop-frontend, app.kubernetes.io/part-of: ecommerce-production-simulation}
      annotations: {sidecar.istio.io/inject: "true"}
    spec:
      automountServiceAccountToken: false
      containers:
      - name: frontend
        image: python:3.12-alpine
        command: [python, /app/server.py]
        env:
        - {name: SHOP_ROLE, value: frontend}
        - {name: REDIS_URL, value: redis-ha.redis-ha.svc.cluster.local:6379}
        - {name: KAFKA_BOOTSTRAP, value: kafka-ha.kafka-ha.svc.cluster.local:9092}
        - {name: RABBITMQ_URL, value: rabbitmq.rabbitmq.svc.cluster.local:5672}
        - {name: KEYCLOAK_URL, value: http://keycloak-keycloakx-http.keycloak.svc.cluster.local}
        ports: [{containerPort: 8080}]
        volumeMounts: [{name: app, mountPath: /app, readOnly: true}]
        readinessProbe: {httpGet: {path: /healthz, port: 8080}, initialDelaySeconds: 2}
        resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {cpu: 250m, memory: 128Mi}}
      volumes: [{name: app, configMap: {name: shop-app}}]
---
apiVersion: v1
kind: Service
metadata: {name: shop-frontend, namespace: production, labels: {app: shop-frontend}}
spec: {selector: {app: shop-frontend}, ports: [{port: 80, targetPort: 8080}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: shop-loadgen, namespace: production, labels: {app: shop-loadgen, app.kubernetes.io/part-of: ecommerce-production-simulation}}
spec:
  replicas: 1
  selector: {matchLabels: {app: shop-loadgen}}
  template:
    metadata: {labels: {app: shop-loadgen, app.kubernetes.io/part-of: ecommerce-production-simulation}, annotations: {sidecar.istio.io/inject: "true"}}
    spec:
      automountServiceAccountToken: false
      containers:
      - name: loadgen
        image: curlimages/curl:8.16.0
        command: [/bin/sh, -ec]
        args: ['while true; do curl -fsS --max-time 2 http://shop-frontend.production.svc.cluster.local/checkout >/dev/null; sleep 0.2; done']
        resources: {requests: {cpu: 25m, memory: 32Mi}, limits: {cpu: 150m, memory: 96Mi}}
