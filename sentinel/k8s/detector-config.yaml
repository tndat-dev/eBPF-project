apiVersion: v1
kind: ConfigMap
metadata:
  name: sentinel-detector-config
  namespace: sentinel-system
data:
  WINDOW_SECONDS: "30"
  MIN_SCORE: "0.80"
  MIN_EVENTS: "20"
  EVENT_QUEUE_SIZE: "100000"
  REQUIRED_WINDOWS: "2"
  RESPONSE_MODE: "audit"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sentinel-detector
  namespace: sentinel-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sentinel-detector
rules:
- apiGroups: [""]
  resources: ["pods", "nodes"]
  verbs: ["get", "list", "watch", "patch"]
- apiGroups: ["policy"]
  resources: ["pods/eviction"]
  verbs: ["create"]
- apiGroups: ["cilium.io"]
  resources: ["ciliumnetworkpolicies"]
  verbs: ["get", "list", "create", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sentinel-detector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: sentinel-detector
subjects:
- kind: ServiceAccount
  name: sentinel-detector
  namespace: sentinel-system
