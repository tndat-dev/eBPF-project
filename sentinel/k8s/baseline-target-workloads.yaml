# Reproducible V7 runtime-security workloads.  Their namespaces, names and
# `app` labels are the explicit model keys in the promoted release:
# default/postgres, production/nginx, production/redis.  They are deliberately
# separate from the AIMS application, which needs its own reviewed baseline.
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-runtime-config
  namespace: production
  labels:
    app: nginx
    app.kubernetes.io/part-of: sentinel-v7-validation
data:
  default.conf: |
    server {
      listen 8080;
      server_name _;
      location / {
        default_type text/plain;
        return 200 'sentinel-nginx-ok\n';
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: production
  labels:
    app: nginx
    app.kubernetes.io/part-of: sentinel-v7-validation
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
        app.kubernetes.io/part-of: sentinel-v7-validation
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 101
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
      - name: nginx
        # Pin the exact image observed during the current validation. A mutable
        # tag would silently change syscall distributions and invalidate the
        # model's normal-baseline evidence.
        image: nginx@sha256:5a88c9c45479443d7be2eadc894b4ed0a9801bae03d97a5760ae13b5c2005942
        command: [nginx]
        args: ["-g", "daemon off;"]
        ports: [{containerPort: 8080, name: http}]
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: {drop: [ALL]}
          readOnlyRootFilesystem: true
          runAsGroup: 101
          runAsNonRoot: true
          runAsUser: 101
        volumeMounts:
        - {name: nginx-config, mountPath: /etc/nginx/conf.d/default.conf, subPath: default.conf, readOnly: true}
        - {name: nginx-cache, mountPath: /var/cache/nginx}
        - {name: nginx-run, mountPath: /var/run}
        - {name: nginx-tmp, mountPath: /tmp}
        readinessProbe:
          httpGet: {path: /, port: http}
          initialDelaySeconds: 3
        livenessProbe:
          httpGet: {path: /, port: http}
          initialDelaySeconds: 10
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits: {cpu: 300m, memory: 128Mi}
      volumes:
      - name: nginx-config
        configMap: {name: nginx-runtime-config}
      - name: nginx-cache
        emptyDir: {}
      - name: nginx-run
        emptyDir: {}
      - name: nginx-tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: production
  labels: {app: nginx}
spec:
  selector: {app: nginx}
  ports: [{name: http, port: 80, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: production
  labels:
    app: redis
    app.kubernetes.io/part-of: sentinel-v7-validation
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
        app.kubernetes.io/part-of: sentinel-v7-validation
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 999
        runAsNonRoot: true
        runAsUser: 999
        seccompProfile: {type: RuntimeDefault}
      containers:
      - name: redis
        image: redis@sha256:c88d347edef6249a6d2293f926f1eeb48bd40c57cbcd02c07f52e7f1fd2cb46b
        args: [redis-server, --save, "", --appendonly, "no"]
        ports: [{containerPort: 6379, name: redis}]
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: {drop: [ALL]}
          readOnlyRootFilesystem: true
          runAsGroup: 999
          runAsNonRoot: true
          runAsUser: 999
        volumeMounts:
        - {name: redis-data, mountPath: /data}
        - {name: redis-tmp, mountPath: /tmp}
        readinessProbe:
          exec: {command: [redis-cli, ping]}
          initialDelaySeconds: 3
        livenessProbe:
          exec: {command: [redis-cli, ping]}
          initialDelaySeconds: 10
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits: {cpu: 400m, memory: 256Mi}
      volumes:
      - name: redis-data
        emptyDir: {}
      - name: redis-tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: production
  labels: {app: redis}
spec:
  selector: {app: redis}
  ports: [{name: redis, port: 6379, targetPort: redis}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: default
  labels:
    app: postgres
    app.kubernetes.io/part-of: sentinel-v7-validation
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
        app.kubernetes.io/part-of: sentinel-v7-validation
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      containers:
      - name: postgres
        image: mirror.gcr.io/postgres@sha256:a426e44bac0b759c95894d68e1a0ac03ecc20b619f498a91aae373bf06d8508d
        env:
        - {name: POSTGRES_USER, value: keycloak}
        - {name: POSTGRES_PASSWORD, value: keycloak}
        - {name: POSTGRES_DB, value: keycloak}
        - {name: POSTGRES_LOG_STATEMENT, value: all}
        ports: [{containerPort: 5432, name: postgres}]
        readinessProbe:
          exec: {command: [pg_isready, -U, keycloak, -d, keycloak]}
          initialDelaySeconds: 5
        livenessProbe:
          exec: {command: [pg_isready, -U, keycloak, -d, keycloak]}
          initialDelaySeconds: 15
        resources:
          requests: {cpu: 100m, memory: 256Mi}
          limits: {cpu: 600m, memory: 768Mi}
        volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
      volumes:
      - name: data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: default
  labels: {app: postgres}
spec:
  selector: {app: postgres}
  ports: [{name: postgres, port: 5432, targetPort: postgres}]
