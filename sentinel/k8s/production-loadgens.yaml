apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadgen
  namespace: production
spec:
  replicas: 1
  selector:
    matchLabels: {app: loadgen}
  template:
    metadata:
      labels: {app: loadgen}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsGroup: 65534
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile: {type: RuntimeDefault}
      containers:
      - name: loadgen
        image: busybox@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
        command: [/bin/sh, -c]
        args:
        - while true; do wget -q -O /dev/null http://nginx.production.svc.cluster.local || true; sleep 1; done
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: {drop: [ALL]}
          readOnlyRootFilesystem: true
          runAsNonRoot: true
        resources:
          requests: {cpu: 10m, memory: 8Mi}
          limits: {cpu: 100m, memory: 32Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-loadgen
  namespace: production
spec:
  replicas: 1
  selector:
    matchLabels: {app: redis-loadgen}
  template:
    metadata:
      labels: {app: redis-loadgen}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsGroup: 999
        runAsNonRoot: true
        runAsUser: 999
        seccompProfile: {type: RuntimeDefault}
      containers:
      - name: loadgen
        image: redis@sha256:5fa2edb1e408fa8235e6db8fab01d1afaaae96c9403ba67b70feceb8661e8621
        command: [/bin/sh, -c]
        args:
        # Keep a bounded 10k-key working set. The redis-benchmark defaults
        # otherwise grow a multi-gigabyte database over a long experiment,
        # turning elapsed time/memory pressure into an uncontrolled variable.
        - while true; do redis-benchmark -h redis -p 6379 -t set,get -r 10000 -n 5000 -q >/dev/null 2>&1; sleep 5; done
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: {drop: [ALL]}
          readOnlyRootFilesystem: true
          runAsNonRoot: true
        resources:
          requests: {cpu: 25m, memory: 32Mi}
          limits: {cpu: 500m, memory: 128Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-loadgen
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels: {app: postgres-loadgen}
  template:
    metadata:
      labels: {app: postgres-loadgen}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsGroup: 999
        runAsNonRoot: true
        runAsUser: 999
        seccompProfile: {type: RuntimeDefault}
      containers:
      - name: loadgen
        image: postgres@sha256:3a82e1f56c8f0f5616a11103ac3d47e632c3938698946a7ad26da0df1334744a
        env:
        - {name: PGPASSWORD, value: keycloak}
        command: [/bin/sh, -c]
        args:
        - while true; do psql -h postgres -U keycloak -d keycloak -c 'SELECT count(*) FROM pg_stat_activity;' >/dev/null 2>&1; sleep 2; done
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: {drop: [ALL]}
          readOnlyRootFilesystem: true
          runAsNonRoot: true
        resources:
          requests: {cpu: 10m, memory: 16Mi}
          limits: {cpu: 200m, memory: 64Mi}
