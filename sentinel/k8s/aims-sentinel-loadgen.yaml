apiVersion: apps/v1
kind: Deployment
metadata:
  name: aims-sentinel-loadgen
  namespace: production
  labels:
    app.kubernetes.io/name: aims-sentinel-loadgen
    app.kubernetes.io/part-of: agent-runtime-sentinel
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: aims-sentinel-loadgen
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aims-sentinel-loadgen
        app.kubernetes.io/part-of: agent-runtime-sentinel
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsGroup: 65534
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile: {type: RuntimeDefault}
      containers:
      - name: loadgen
        image: busybox@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
        command: [/bin/sh, -c]
        args:
        - |
          set -eu
          services="api-gateway auth-service cart-service catalog-service inventory-service order-service payment-service notification-service security-telemetry-service"
          i=0
          while true; do
            # This pod remains inside ambient mode and exercises east-west
            # traffic through the namespace waypoint.
            for service in $services; do
              wget -q -O /dev/null -T 3 "http://$service:8000/api/health/" || true
            done
            # A smaller, explicitly normal Internet error mix is retained.
            # It runs once per five cycles instead of dominating every cycle.
            if [ $((i % 5)) -eq 0 ]; then
              wget -q -O /dev/null -T 3 "http://api-gateway:8000/api/auth/me/" || true
              wget -q -O /dev/null -T 3 "http://api-gateway:8000/api/cart/" || true
            fi
            i=$((i + 1))
            sleep "${SLEEP_SECONDS:-1}"
          done
        env:
        - {name: SLEEP_SECONDS, value: "1"}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: {drop: [ALL]}
          readOnlyRootFilesystem: true
          runAsNonRoot: true
        resources:
          requests: {cpu: 10m, memory: 8Mi}
          limits: {cpu: 250m, memory: 32Mi}
---
# North-south traffic must originate outside ambient capture. Sending a
# request from an ambient workload back into the ingress Gateway is an
# unsupported mesh hairpin in this topology and previously produced 10-second
# ztunnel timeouts. The pod stays in namespace production, but explicitly
# opts out so it behaves like an external client.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aims-sentinel-ingress-loadgen
  namespace: production
  labels:
    app.kubernetes.io/name: aims-sentinel-ingress-loadgen
    app.kubernetes.io/part-of: agent-runtime-sentinel
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: aims-sentinel-ingress-loadgen
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aims-sentinel-ingress-loadgen
        app.kubernetes.io/part-of: agent-runtime-sentinel
        istio.io/dataplane-mode: none
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsGroup: 65534
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile: {type: RuntimeDefault}
      containers:
      - name: loadgen
        image: busybox@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
        command: [/bin/sh, -c]
        args:
        - |
          set -eu
          ingress=http://aims-ingress-istio.istio-ingress.svc.cluster.local
          i=0
          while true; do
            wget -q -O /dev/null -T 3 "$ingress/" || true
            sleep "${REQUEST_INTERVAL_SECONDS:-0.22}"
            wget -q -O /dev/null -T 3 "$ingress/api/health/" || true
            sleep "${REQUEST_INTERVAL_SECONDS:-0.22}"
            wget -q -O /dev/null -T 3 "$ingress/api/products/" || true
            sleep "${REQUEST_INTERVAL_SECONDS:-0.22}"
            wget -q -O /dev/null -T 3 "$ingress/api/products/1/" || true
            sleep "${REQUEST_INTERVAL_SECONDS:-0.22}"
            if [ $((i % 5)) -eq 0 ]; then
              wget -q -O /dev/null -T 3 "$ingress/api/auth/me/" || true
              sleep "${REQUEST_INTERVAL_SECONDS:-0.22}"
              wget -q -O /dev/null -T 3 "$ingress/api/cart/" || true
              sleep "${REQUEST_INTERVAL_SECONDS:-0.22}"
            fi
            i=$((i + 1))
          done
        env:
        # Preserve roughly the previous 4.4 request/s steady-state rate while
        # distributing requests across second boundaries. This avoids periodic
        # empty 1-second feature buckets without increasing traffic materially.
        - {name: REQUEST_INTERVAL_SECONDS, value: "0.22"}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: {drop: [ALL]}
          readOnlyRootFilesystem: true
          runAsNonRoot: true
        resources:
          requests: {cpu: 10m, memory: 8Mi}
          limits: {cpu: 250m, memory: 32Mi}
---
# Safe protocol/readiness traffic for stateful AIMS dependencies.  It performs
# no database write, message publish, object upload, or external network call.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aims-sentinel-dependency-loadgen
  namespace: production
  labels:
    app.kubernetes.io/name: aims-sentinel-dependency-loadgen
    app.kubernetes.io/part-of: agent-runtime-sentinel
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: aims-sentinel-dependency-loadgen
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aims-sentinel-dependency-loadgen
        app.kubernetes.io/part-of: agent-runtime-sentinel
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsGroup: 65534
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile: {type: RuntimeDefault}
      containers:
      - name: dependency-loadgen
        image: busybox@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
        command: [/bin/sh, -c]
        args:
        - |
          set -eu
          while true; do
            # Redis PING (RESP), read-only MinIO root, and bounded protocol/TCP
            # handshakes. Server processes execute accept/read/write paths,
            # while no persistent business state is changed.
            printf '*2\r\n$4\r\nAUTH\r\n$%s\r\n%s\r\n*1\r\n$4\r\nPING\r\n' \
              "${#REDIS_PASSWORD}" "$REDIS_PASSWORD" | \
              nc -w 2 aims-redis 6379 >/dev/null 2>&1 || true
            wget -q -O /dev/null -T 3 http://minio/minio/health/live || true
            printf '' | nc -w 2 aims-postgres-cnpg-rw 5432 >/dev/null 2>&1 || true
            printf '' | nc -w 2 aims-kafka-kafka-bootstrap 9092 >/dev/null 2>&1 || true
            printf '' | nc -w 2 aims-rabbitmq 5672 >/dev/null 2>&1 || true
            sleep "${SLEEP_SECONDS:-2}"
          done
        env:
        - {name: SLEEP_SECONDS, value: "2"}
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: aims-redis-auth
              key: password
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: {drop: [ALL]}
          readOnlyRootFilesystem: true
          runAsNonRoot: true
        resources:
          requests: {cpu: 10m, memory: 8Mi}
          limits: {cpu: 200m, memory: 32Mi}
---
# Read-only traffic with a different request mix. It is kept at zero replicas
# outside the controlled ``toolmix``/``burst`` regimes so an experiment can
# reproduce exactly when this distribution shift was introduced.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aims-sentinel-readmix-loadgen
  namespace: production
  labels:
    app.kubernetes.io/name: aims-sentinel-readmix-loadgen
    app.kubernetes.io/part-of: agent-runtime-sentinel
spec:
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: aims-sentinel-readmix-loadgen
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aims-sentinel-readmix-loadgen
        app.kubernetes.io/part-of: agent-runtime-sentinel
        istio.io/dataplane-mode: none
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsGroup: 65534
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile: {type: RuntimeDefault}
      containers:
      - name: loadgen
        image: busybox@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
        command: [/bin/sh, -c]
        args:
        - |
          set -eu
          ingress=http://aims-ingress-istio.istio-ingress.svc.cluster.local
          i=0
          while true; do
            # Only safe reads/HEADs are used: this generator must never create
            # orders, capture payments, change inventory, or poison baselines.
            case $((i % 6)) in
              0) wget -q -O /dev/null -T 3 "$ingress/" || true ;;
              1) wget -q -O /dev/null -T 3 "$ingress/api/products/" || true ;;
              2) wget -q -O /dev/null -T 3 "$ingress/api/products/1/" || true ;;
              3) wget -q --spider -T 3 "$ingress/api/products/" || true ;;
              4) wget -q -O /dev/null -T 3 "$ingress/api/auth/me/" || true ;;
              5) wget -q -O /dev/null -T 3 "$ingress/api/health/" || true ;;
            esac
            i=$((i + 1))
            sleep "${SLEEP_SECONDS:-1}"
          done
        env:
        - {name: SLEEP_SECONDS, value: "1"}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: {drop: [ALL]}
          readOnlyRootFilesystem: true
          runAsNonRoot: true
        resources:
          requests: {cpu: 10m, memory: 8Mi}
          limits: {cpu: 250m, memory: 32Mi}
