global
    log /dev/log local0
    log /dev/log local1 notice
    user haproxy
    group haproxy
    daemon

defaults
    log global
    mode tcp
    option tcplog
    timeout connect 3s
    timeout client 1h
    timeout server 1h

frontend sentinel_kubeapi
    bind 127.0.0.1:7443
    default_backend kube_control_planes

backend kube_control_planes
    balance roundrobin
    option tcp-check
    default-server inter 2s fall 2 rise 2
    server control-plane-1 10.1.16.234:6443 check
    server control-plane-2 10.1.16.235:6443 check
    server control-plane-3 10.1.16.236:6443 check
