apiVersion: cilium.io/v1alpha1
kind: TracingPolicyNamespaced
metadata:
  name: sentinel-rca-runtime-v1
  namespace: production
  labels:
    app.kubernetes.io/part-of: sentinel-pulse
    sentinel.hust.vn/purpose: rca-evidence
    sentinel.hust.vn/revision: sensitive-paths-20261019
spec:
  # Namespace scope includes all production workloads, not only hardened apps.
  # Every action is observation-only; no Override, Signal or Sigkill action.
  #
  # Revision 19/10: rateLimit only folds *identical* events, so every distinct file
  # still produced one event: ~1,000 openat/s plus ~350 commit_creds/s per node, more
  # than `kubectl exec` could stream (policy events arrived ~80 s late, after cases were
  # built). File hooks now keep only sensitive paths (user-supplied paths: relative
  # opens are not seen), commit_creds is dropped (every exec calls it; set*id/capset stay).
  kprobes:
    - call: sys_connect
      syscall: true
      return: true
      args:
        - {index: 0, type: int, label: socket_fd}
        - {index: 1, type: sockaddr, label: destination}
      returnArg: &result {index: 0, type: int64}
    - call: sys_openat
      syscall: true
      return: true
      args:
        - {index: 0, type: int, label: dirfd}
        - {index: 1, type: string, label: filename}
        - {index: 2, type: int, label: flags}
        - {index: 3, type: int, label: mode}
      returnArg: *result
      selectors: &sensitiveRead
        - matchArgs:
            - index: 1
              operator: Prefix
              values: ["/etc/shadow", "/etc/gshadow", "/etc/passwd", "/etc/group", "/etc/sudoers",
                       "/etc/ssh/", "/etc/cron", "/etc/kubernetes/", "/root/", "/var/run/secrets/",
                       "/run/secrets/", "/proc/1/", "/proc/kcore", "/dev/mem", "/var/lib/kubelet/"]
          matchActions:
            - {action: Post, rateLimit: 1s, rateLimitScope: process}
    - call: sys_openat2
      syscall: true
      return: true
      args:
        - {index: 0, type: int, label: dirfd}
        - {index: 1, type: string, label: filename}
      returnArg: *result
      selectors: *sensitiveRead
    - call: vfs_write
      syscall: false
      return: true
      args:
        - {index: 0, type: file, label: file}
        - {index: 2, type: size_t, label: requested_bytes}
      returnArg: *result
      selectors: &sensitiveWrite
        - matchArgs:
            - index: 0
              operator: Prefix
              values: ["/etc/", "/root/", "/usr/", "/bin/", "/sbin/", "/lib/", "/lib64/",
                       "/var/spool/cron", "/var/run/secrets/", "/run/secrets/"]
          matchActions:
            - {action: Post, rateLimit: 1s, rateLimitScope: process}
    - call: vfs_writev
      syscall: false
      return: true
      args:
        - {index: 0, type: file, label: file}
        - {index: 2, type: size_t, label: iov_count}
      returnArg: *result
      selectors: *sensitiveWrite
    - call: sys_unlinkat
      syscall: true
      return: true
      args:
        - {index: 0, type: int, label: dirfd}
        - {index: 1, type: string, label: filename}
        - {index: 2, type: int, label: flags}
      returnArg: *result
    - call: sys_renameat2
      syscall: true
      return: true
      args:
        - {index: 0, type: int, label: old_dirfd}
        - {index: 1, type: string, label: old_path}
        - {index: 2, type: int, label: new_dirfd}
        - {index: 3, type: string, label: new_path}
        - {index: 4, type: int, label: flags}
      returnArg: *result
    - call: sys_setuid
      syscall: true
      return: true
      args: [{index: 0, type: uint32, label: uid}]
      returnArg: *result
    - call: sys_setgid
      syscall: true
      return: true
      args: [{index: 0, type: uint32, label: gid}]
      returnArg: *result
    - call: sys_setreuid
      syscall: true
      return: true
      args:
        - {index: 0, type: uint32, label: ruid}
        - {index: 1, type: uint32, label: euid}
      returnArg: *result
    - call: sys_setregid
      syscall: true
      return: true
      args:
        - {index: 0, type: uint32, label: rgid}
        - {index: 1, type: uint32, label: egid}
      returnArg: *result
    - call: sys_setresuid
      syscall: true
      return: true
      args:
        - {index: 0, type: uint32, label: ruid}
        - {index: 1, type: uint32, label: euid}
        - {index: 2, type: uint32, label: suid}
      returnArg: *result
    - call: sys_setresgid
      syscall: true
      return: true
      args:
        - {index: 0, type: uint32, label: rgid}
        - {index: 1, type: uint32, label: egid}
        - {index: 2, type: uint32, label: sgid}
      returnArg: *result
    - {call: sys_capset, syscall: true, return: true, returnArg: *result}
    - call: sys_setns
      syscall: true
      return: true
      args:
        - {index: 0, type: int, label: namespace_fd}
        - {index: 1, type: int, label: namespace_flags}
      returnArg: *result
    - call: sys_unshare
      syscall: true
      return: true
      args: [{index: 0, type: uint64, label: namespace_flags}]
      returnArg: *result
    - call: sys_mount
      syscall: true
      return: true
      args:
        - {index: 0, type: string, label: mount_source}
        - {index: 1, type: string, label: mount_target}
        - {index: 2, type: string, label: filesystem}
        - {index: 3, type: uint64, label: flags}
      returnArg: *result
    - call: sys_umount
      syscall: true
      return: true
      args:
        - {index: 0, type: string, label: mount_target}
        - {index: 1, type: int, label: flags}
      returnArg: *result
    - call: sys_ptrace
      syscall: true
      return: true
      args:
        - {index: 0, type: uint64, label: ptrace_request}
        - {index: 1, type: int, label: target_pid}
        - {index: 2, type: uint64, label: target_address}
      returnArg: *result
---
apiVersion: cilium.io/v1alpha1
kind: TracingPolicyNamespaced
metadata:
  name: sentinel-rca-fork-v1
  namespace: production
  labels:
    app.kubernetes.io/part-of: sentinel-pulse
    sentinel.hust.vn/purpose: rca-evidence
spec:
  # Tetragon v1.6.1 requires separate policies for different hook sections.
  tracepoints:
    - subsystem: sched
      event: sched_process_fork
      # Verified Linux 6.8 format: common fields occupy indices 0..3.
      args:
        # pid_t is a signed 32-bit scalar; int yielded zero and auto cannot
        # resolve tracepoint.PidTy in v1.6.1. Use its explicit scalar reader.
        # This release omits tracepoint labels in JSON: normalize by this order.
        - {index: 5, type: int32, label: parent_pid}
        - {index: 7, type: int32, label: child_pid}
