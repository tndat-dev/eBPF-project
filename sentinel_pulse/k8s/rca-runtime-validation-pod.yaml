apiVersion: v1
kind: Namespace
metadata:
  name: sentinel-rca-validation
  labels:
    app.kubernetes.io/part-of: sentinel-pulse
---
apiVersion: v1
kind: Pod
metadata:
  name: rca-runtime-proof-20261015
  namespace: sentinel-rca-validation
  labels:
    app.kubernetes.io/name: rca-runtime-proof
spec:
  nodeSelector:
    kubernetes.io/hostname: k8s-worker1.local
  automountServiceAccountToken: false
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    # Allow syscall entry to reach the kernel for return-probe verification.
    # All capabilities are dropped; no host namespaces, mounts or privilege.
    seccompProfile: {type: Unconfined}
  containers:
    - name: probe
      image: busybox:1.37.0
      command: [sh, -c, "sleep 3600"]
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: {drop: [ALL]}
      resources:
        requests: {cpu: 10m, memory: 16Mi}
        limits: {cpu: 100m, memory: 64Mi}
      volumeMounts:
        - {name: proof, mountPath: /proof}
  volumes:
    - name: proof
      emptyDir: {sizeLimit: 32Mi}
