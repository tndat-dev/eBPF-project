apiVersion: v1
kind: Namespace
metadata:
  name: agent-sentinel-lab
  labels:
    app.kubernetes.io/part-of: agent-runtime-sentinel
    app.kubernetes.io/environment: evaluation
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mcp-tls-nginx-config
  namespace: agent-sentinel-lab
data:
  default.conf: |
    server {
      listen 8443 ssl;
      server_name mcp-server;
      ssl_certificate /etc/mcp-tls/tls.crt;
      ssl_certificate_key /etc/mcp-tls/tls.key;
      ssl_protocols TLSv1.2 TLSv1.3;
      default_type application/json;

      location /mcp {
        # The demo server is deliberately non-executing: it acknowledges MCP
        # JSON-RPC transport but never runs requested tools.
        return 200 '{"jsonrpc":"2.0","result":{"accepted":true},"id":1}';
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-tls-server
  namespace: agent-sentinel-lab
  labels:
    app: mcp-tls-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-tls-server
  template:
    metadata:
      labels:
        app: mcp-tls-server
        app.kubernetes.io/part-of: agent-runtime-sentinel
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: generate-ephemeral-tls-cert
          image: docker.io/nicolaka/netshoot@sha256:b09d9b21381f47a79b3cbcb30da25266dc17186ea00ae65e99fdc51396f48e70
          command: ["/bin/sh", "-ec"]
          args:
            - |
              openssl req -x509 -newkey rsa:2048 -sha256 -nodes \
                -keyout /tls/tls.key -out /tls/tls.crt -days 1 \
                -subj '/CN=mcp-server.agent-sentinel-lab.svc'
              chmod 0444 /tls/tls.crt
              chmod 0400 /tls/tls.key
          volumeMounts:
            - name: tls
              mountPath: /tls
            - name: cache
              mountPath: /cache
            - name: run
              mountPath: /run
            - name: tmp
              mountPath: /tmp
          securityContext:
            runAsUser: 101
            runAsGroup: 101
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
      containers:
        - name: mcp-tls-server
          image: docker.io/library/nginx@sha256:5a88c9c45479443d7be2eadc894b4ed0a9801bae03d97a5760ae13b5c2005942
          ports:
            - name: https-mcp
              containerPort: 8443
          readinessProbe:
            tcpSocket:
              port: https-mcp
            initialDelaySeconds: 2
            periodSeconds: 3
          securityContext:
            runAsUser: 101
            runAsGroup: 101
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d
              readOnly: true
            - name: tls
              mountPath: /etc/mcp-tls
              readOnly: true
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /var/run
      volumes:
        - name: nginx-config
          configMap:
            name: mcp-tls-nginx-config
        - name: tls
          emptyDir:
            medium: Memory
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-tls-server
  namespace: agent-sentinel-lab
spec:
  selector:
    app: mcp-tls-server
  ports:
    - name: https-mcp
      port: 8443
      targetPort: https-mcp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-normal-loadgen
  namespace: agent-sentinel-lab
  labels:
    app: mcp-normal-loadgen
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-normal-loadgen
  template:
    metadata:
      labels:
        app: mcp-normal-loadgen
        agent-runtime-sentinel.io/agent-id: documentation-agent
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 102
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: loadgen
          image: docker.io/curlimages/curl@sha256:463eaf6072688fe96ac64fa623fe73e1dbe25d8ad6c34404a669ad3ce1f104b6
          command: ["/bin/sh", "-ec"]
          args:
            - |
              payload='{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"search_docs","arguments":{"uri":"kb://runbook"}}}'
              while true; do
                curl --silent --show-error --fail --insecure \
                  --connect-timeout 2 --max-time 5 \
                  -H 'content-type: application/json' \
                  --data "$payload" \
                  https://mcp-tls-server:8443/mcp >/dev/null
                sleep 0.2
              done
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 102
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 96Mi
